services:
  gpu-model-api:
    # Imagem pre-build no GitHub Container Registry (build via GitHub Actions
    # ou via docker run+commit no host). NUNCA use 'build: .' em stack Git no
    # Portainer (falha por falta de docker context).
    image: ghcr.io/pattrickx/gpu-model-api:latest
    container_name: gpu-model-api
    restart: unless-stopped
    working_dir: /app
    # python3 (a imagem base nvidia/cuda so tem python3, nao python)
    command: ["python3", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_A_REPO=black-forest-labs/FLUX.1-schnell
      - MODEL_B_REPO=stabilityai/stable-diffusion-xl-base-1.0
      - DEFAULT_NUM_STEPS=4
      - DEFAULT_SEED=42
      - TORCH_DTYPE=bfloat16
      # Evita fragmentacao de VRAM (SDXL vertical cabia so com isso na 12GB)
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OUTPUT_DIR=/app/output
    volumes:
      # Cache dos pesos do HuggingFace (sobrevive a redeploys)
      - models_cache:/models
      # Imagens geradas (opcional: montar para acessar os PNGs)
      - generated:/app/output
    # GPU passthrough (requer NVIDIA Container Toolkit + spec CDI no host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # shm grande ajuda no decode de imagens grandes
    shm_size: "8gb"

volumes:
  models_cache:
  generated:
