services:
  gpu-model-api:
    image: ghcr.io/pattrickx/gpu-model-api:latest
    container_name: gpu-model-api
    restart: unless-stopped
    working_dir: /app
    command: ["sh","-c","pip install -q python-multipart imageio-ffmpeg kokoro soundfile qwen-asr 'diffusers>=0.39.0' chatterbox-tts f5-tts && pip install -q --no-deps qwen-tts && pip install -q onnxruntime && pip install -q 'torchaudio==2.7.1+cu126' --index-url https://download.pytorch.org/whl/cu126 && ln -sf $(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())') /usr/local/bin/ffmpeg && bash /app/app/setup_wav2lip.sh && mkdir -p /app && [ -f /models/ref_audio_en.wav ] || cp /root/build/gpu-model-api/ref_audio_en.wav /app/ref_audio_en.wav 2>/dev/null || true && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_HOME=/models
      - MODEL_A_REPO=black-forest-labs/FLUX.1-schnell
      - MODEL_B_REPO=stabilityai/stable-diffusion-xl-base-1.0
      - MODEL_C_REPO=hexgrad/Kokoro-82M
      - MODEL_D_REPO=Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      - MODEL_E_REPO=openai/whisper-large-v3-turbo
      - MODEL_F_REPO=nyralabs/CrisperWhisper2.0_large
      - MODEL_G_REPO=nvidia/parakeet-tdt-0.6b-v3
      - MODEL_H_REPO=Qwen/Qwen3-ASR-0.6B
      - MODEL_I_REPO=Qwen/Qwen3-ASR-1.7B
      - MODEL_J_REPO=stabilityai/sdxl-turbo
      - MODEL_K_REPO=stabilityai/sd-turbo
      - MODEL_L_REPO=ByteDance/SDXL-Lightning
      - MODEL_M_REPO=black-forest-labs/FLUX.2-klein-4B
      - MODEL_N_REPO=black-forest-labs/FLUX.2-klein-4b-fp8
      - MODEL_O_REPO=black-forest-labs/FLUX.2-klein-base-4B
      - MODEL_P_REPO=ResembleAI/chatterbox
      - MODEL_Q_REPO=SWivid/F5-TTS
      - DEFAULT_NUM_STEPS=4
      - DEFAULT_SEED=42
      - TORCH_DTYPE=bfloat16
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OUTPUT_DIR=/app/output
    volumes:
      - /root/build/gpu-model-api/app:/app/app:ro
      - models_cache:/models
      - generated:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "8gb"
volumes:
  models_cache:
  generated:
